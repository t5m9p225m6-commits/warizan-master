<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>わりざんマスター v4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6ff;color:#20304a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}main{max-width:800px;margin:auto;padding:10px}.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 22px #23375a1f}h1{text-align:center;margin:2px;font-size:29px}.sub{text-align:center;color:#64748b;margin:2px 0 9px}.row,.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.pill{background:#e8f2ff;border-radius:99px;padding:7px 10px;font-weight:800}button{border:0;border-radius:14px;min-height:50px;padding:9px 11px;font-size:16px;font-weight:900;touch-action:manipulation}.tabs button{background:#dbeafe}.on{outline:4px solid #93c5fd}.blue{background:#2563eb;color:white}.yellow{background:#fde68a}.green{background:#dcfce7}.soft{background:#dbeafe}.purple{background:#ede9fe}.story{text-align:center;font-size:18px;min-height:52px;margin:12px 0 0;line-height:1.45}.problem{text-align:center;font-size:46px;font-weight:900;margin:7px}.visual{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:55px}.group{border:2px solid #93c5fd;border-radius:11px;padding:5px}.left{border-style:dashed;border-color:#f59e0b}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#60a5fa;margin:2px}.left .dot{background:#fbbf24}.answer{text-align:center;margin:7px}.answer input{width:92px;font-size:31px;text-align:center;border:3px solid #94a3b8;border-radius:11px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.msg{text-align:center;font-size:19px;font-weight:900;min-height:55px;padding:8px}.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:9px 0}.bar{height:100%;background:#60a5fa;width:0}.panel{background:#f8fafc;border-radius:14px;padding:10px;margin-top:9px}.town{text-align:center;font-size:27px;min-height:37px}.badges{text-align:center;font-size:23px}.small{font-size:13px;color:#64748b;line-height:1.5}.challenge{font-weight:800;text-align:center;margin:4px}.hidden{display:none}footer{text-align:center;font-size:12px;color:#64748b;margin:9px}@media(max-width:480px){.problem{font-size:40px}.story{font-size:16px}.card{padding:11px}}
</style></head><body><main><section class="card"><h1>➗ わりざんマスター</h1><p class="sub">見て・分けて・九九につなげよう</p>
<div class="row"><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">📝 今日 <b id="today">0</b>問</span></div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="challengeText" class="challenge">今日の10問 0/10</div>
<div class="tabs"><button id="equal">同じ数ずつ</button><button id="group">いくつ分</button><button id="remain">あまり</button><button id="storyMode" class="purple">文章題</button><button id="weak" class="green">にがて復習</button></div>
<div id="story" class="story"></div><div id="problem" class="problem"></div><div id="visual" class="visual"></div>
<div class="answer">答え <input id="ans" type="number" inputmode="numeric" autocomplete="off"> <span id="rw">あまり <input id="rem" type="number" inputmode="numeric" autocomplete="off"></span></div>
<div class="buttons"><button id="check" class="blue">こたえあわせ</button><button id="hint" class="yellow">ヒント</button><button id="next" class="soft">つぎの問題</button><button id="easy" class="green">やさしくする</button></div><div id="msg" class="msg" aria-live="polite"></div>
<div class="panel"><b>🏘️ わりざんタウン</b><div id="town" class="town"></div><div id="badges" class="badges"></div></div>
<div class="panel"><b>🌱 学習の見取り</b><div id="record" class="small"></div></div>
</section><footer>名前などの個人情報は集めません。学習記録はこの端末内だけに保存します。</footer></main>
<script>"use strict";(()=>{const $=x=>document.getElementById(x),K="warizanMasterV4",todayKey=()=>new Date().toISOString().slice(0,10);
let s={stars:0,streak:0,tries:0,correct:0,miss:{equal:0,group:0,remain:0,story:0},weak:[],day:todayKey(),dayDone:0},mode="equal",q=null,h=0,done=false,serial=0;
try{Object.assign(s,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){} if(s.day!==todayKey()){s.day=todayKey();s.dayDone=0}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,save=()=>{try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}};
function stats(){$("stars").textContent=s.stars;$("streak").textContent=s.streak;$("today").textContent=s.dayDone;$("bar").style.width=Math.min(100,s.dayDone*10)+"%";$("challengeText").textContent=s.dayDone>=10?"🎉 今日の10問クリア！":"今日の10問 "+s.dayDone+"/10";
let w=Object.entries(s.miss).sort((a,b)=>b[1]-a[1])[0],nm={equal:"同じ数ずつ",group:"いくつ分",remain:"あまり",story:"文章題"},rate=s.tries?Math.round(s.correct/s.tries*100):0;$("record").textContent="正解率 "+rate+"％。"+(w[1]?"今は「"+nm[w[0]]+"」で迷うことが多めです。図や九九を使って支援するとよさそうです。":"まだ目立ったつまずきはありません。");
let icons=["🏠","🌳","🏫","🏪","🌷","🏡","🌲","🏰","🚉","🎡"],n=Math.min(10,Math.floor(s.correct/3)+1);$("town").textContent=icons.slice(0,n).join(" ");let b=[];if(s.correct>=5)b.push("🥉");if(s.correct>=15)b.push("🥈");if(s.correct>=30)b.push("🥇");if(s.dayDone>=10)b.push("🏅");if(s.streak>=5)b.push("🔥");$("badges").textContent=b.length?"バッジ "+b.join(" "):"バッジはこれから！"}
function box(n,left=false){let b=document.createElement("span");b.className="group"+(left?" left":"");for(let i=0;i<n;i++){let d=document.createElement("i");d.className="dot";b.appendChild(d)}return b}
function draw(g,e,l=0){$("visual").innerHTML="";if(g*e+l>48)return;for(let i=0;i<g;i++)$("visual").appendChild(box(e));if(l)$("visual").appendChild(box(l,true))}
function base(easy=false,m=mode){let d=easy?rnd(2,5):rnd(2,9),a=easy?rnd(1,5):rnd(1,9),r=m==="remain"?rnd(1,d-1):0;return {d,a,r,n:d*a+r,m}}
function make(easy=false){serial++; if(s.weak.length&&serial%4===0&&!easy){q=s.weak.shift();mode=q.m}else q=base(easy,mode==="story"?(Math.random()<.5?"equal":"group"):mode);h=0;done=false;$("ans").value="";$("rem").value="";$("msg").textContent="";$("rw").style.display=q.m==="remain"?"inline":"none";
if(mode==="story"){let eq=q.m==="equal";$("story").textContent=eq?("あめが "+q.n+"こあります。"+q.d+"人で同じ数ずつ分けます。1人分は何こですか。"):("えんぴつが "+q.n+"本あります。"+q.d+"本ずつのたばにします。何たばできますか。");$("problem").textContent=q.n+" ÷ "+q.d+" ＝ ？";draw(eq?q.d:q.a,eq?q.a:q.d)}
else if(q.m==="equal"){$("story").textContent=q.n+"こを "+q.d+"人に同じ数ずつ分けます。1人分はいくつ？";$("problem").textContent=q.n+" ÷ "+q.d+" ＝ ？";draw(q.d,q.a)}
else if(q.m==="group"){$("story").textContent=q.n+"こを "+q.d+"こずつに分けます。何グループできる？";$("problem").textContent=q.n+" ÷ "+q.d+" ＝ ？";draw(q.a,q.d)}
else{$("story").textContent=q.n+"こを "+q.d+"こずつに分けます。何グループできて、いくつあまる？";$("problem").textContent=q.n+" ÷ "+q.d+" ＝ ？";draw(q.a,q.d,q.r)}
["equal","group","remain","storyMode"].forEach(x=>$(x).classList.remove("on"));$(mode==="story"?"storyMode":mode).classList.add("on");$("ans").focus()}
function hint(){h++;$("msg").textContent=h===1?q.d+" × □ で "+(q.n-q.r)+" になる九九を探そう。":h===2?q.d+" × "+q.a+" ＝ "+(q.d*q.a)+"。図のまとまりも数えよう。":"答えの部分は "+q.a+(q.m==="remain"?"。黄色い●があまりです。":"。")}
function check(){if(done)return;let a=$("ans").value.trim(),r=$("rem").value.trim();if(!a){$("msg").textContent="答えを入れてね。";return}if(q.m==="remain"&&!r){$("msg").textContent="あまりも入れてね。";return}s.tries++;let ok=+a===q.a&&(q.m!=="remain"||+r===q.r);if(ok){done=true;s.correct++;s.stars++;s.streak++;s.dayDone++;$("msg").textContent=s.dayDone===10?"🏅 せいかい！ 今日の10問クリア！":"⭕ せいかい！";}else{s.streak=0;s.miss[mode==="story"?"story":q.m]++;if(s.weak.length<8)s.weak.push({...q});$("msg").textContent="△ おしい！ この問題は少し後でもう一度出るよ。"}save();stats()}
function set(m){mode=m;make()}$("equal").onclick=()=>set("equal");$("group").onclick=()=>set("group");$("remain").onclick=()=>set("remain");$("storyMode").onclick=()=>set("story");$("weak").onclick=()=>{if(s.weak.length){q=s.weak.shift();mode=q.m;makeFromWeak()}else{let w=Object.entries(s.miss).filter(x=>x[0]!=="story").sort((a,b)=>b[1]-a[1])[0];set(w&&w[1]?w[0]:"equal")}};
function makeFromWeak(){let keep=q;make();q=keep;mode=q.m;h=0;done=false;$("ans").value="";$("rem").value="";$("rw").style.display=q.m==="remain"?"inline":"none";$("problem").textContent=q.n+" ÷ "+q.d+" ＝ ？";$("story").textContent="前にまちがえた問題に、もう一度チャレンジ！";draw(q.m==="equal"?q.d:q.a,q.m==="equal"?q.a:q.d,q.r)}
$("check").onclick=check;$("hint").onclick=hint;$("next").onclick=()=>make();$("easy").onclick=()=>make(true);$("ans").onkeydown=e=>{if(e.key==="Enter")q.m==="remain"?$("rem").focus():check()};$("rem").onkeydown=e=>{if(e.key==="Enter")check()};stats();make()})();</script></body></html>
