<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>わりざんマスター 2.0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#17324d;background:linear-gradient(#dff3ff,#f8fbff 42%,#e9f8df);min-height:100vh}
main{max-width:850px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d9e8f4;border-radius:24px;padding:18px;box-shadow:0 12px 32px #31506d1a;margin-bottom:12px}
h1,h2,p{margin-top:0}h1{text-align:center;margin-bottom:2px}.sub{text-align:center;color:#60758a}.top{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.pill{background:#eef6ff;border-radius:99px;padding:7px 11px;font-weight:900}
button{border:0;border-radius:15px;min-height:50px;padding:10px 14px;font:900 16px inherit;cursor:pointer;box-shadow:0 3px 0 #17324d20;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:none}button:focus-visible,input:focus-visible{outline:3px solid #7c3aed;outline-offset:3px}
.primary{background:#2563eb;color:#fff}.green{background:#dcfce7}.yellow{background:#fde68a}.soft{background:#e7f0fa}.orange{background:#ffedd5}.purple{background:#ede9fe}
.screen{display:none}.screen.on{display:block}.hero{text-align:center;padding:18px 8px}.hero .big{font-size:54px}.hero button{width:min(100%,430px);font-size:21px;margin:6px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.stage{min-height:100px;padding:8px 5px;background:#e8f2ff;color:#17324d}.stage.lock{opacity:.45}.stage.done{background:#dcfce7}.stage .ico{font-size:27px;display:block}.stars{font-size:17px}
.progress{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:#60a5fa;width:0;transition:.2s}.roundhead{display:flex;justify-content:space-between;gap:8px;font-weight:900;margin:8px 0}
.story{text-align:center;font-size:18px;min-height:48px;margin-top:16px}.problem{text-align:center;font-size:clamp(38px,8vw,54px);font-weight:1000;margin:8px}.visual{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;max-width:570px;margin:8px auto;min-height:35px}.dot{width:15px;height:15px;border-radius:50%;background:#60a5fa}
.answer{text-align:center;margin:18px 0}.answer input{width:90px;min-height:54px;border:3px solid #94a3b8;border-radius:12px;text-align:center;font-size:31px}.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;max-width:520px;margin:auto}.msg{text-align:center;min-height:52px;padding:9px;font-size:19px;font-weight:900}
.hintbox{display:none;background:#fff8d9;border-radius:14px;padding:11px;margin:8px auto;max-width:580px;text-align:center}.hintbox.on{display:block}
.result{text-align:center}.score{font-size:60px;font-weight:1000}.resultstars{font-size:46px;letter-spacing:4px}.records{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.rec{background:#f4f8fc;border-radius:14px;padding:10px}.rec b{font-size:22px}
.collection{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.badge{background:#f4f8fc;border-radius:13px;padding:9px;text-align:center;min-height:75px}.badge .ico{font-size:28px}.badge.lock{filter:grayscale(1);opacity:.35}
.town{font-size:31px;text-align:center;line-height:1.7;min-height:58px}.tiny{font-size:12px;color:#667b90;line-height:1.5}.footer{text-align:center;color:#667b90;font-size:12px;padding:8px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;font-style:normal;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
@media(max-width:600px){main{padding:8px}.card{padding:13px}.map{grid-template-columns:repeat(2,1fr)}.stage:last-child{grid-column:1/-1}.records{grid-template-columns:1fr 1fr}.collection{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><main>
<section id="home" class="screen on">
 <div class="card hero">
  <div class="big">➗</div><h1>わりざんマスター 2.0</h1><p class="sub">10問クリアして、わりざんタウンを育てよう！</p>
  <div class="top"><span class="pill">🏆 クリア <b id="clears">0</b>回</span><span class="pill">🔥 最高 <b id="bestStreak">0</b>連続</span><span class="pill">⭐ <b id="totalStars">0</b>/15</span></div>
  <button id="continue" class="primary">▶ つづきから 10問チャレンジ</button>
  <button id="collectionBtn" class="yellow">🏅 コレクション・記録</button>
 </div>
 <div class="card"><h2>🗺️ ステージ</h2><div id="map" class="map"></div><div class="town" id="town"></div><p class="tiny" style="text-align:center">★を集めると町が発展するよ。各ステージは10問で終了します。</p></div>
</section>

<section id="game" class="screen">
 <div class="card">
  <div class="roundhead"><span id="stageName"></span><span id="qnum">1 / 10</span></div><div class="progress"><div id="bar" class="bar"></div></div>
  <div id="story" class="story"></div><div id="problem" class="problem"></div><div id="visual" class="visual"></div>
  <div class="answer">答え <input id="ans" type="text" inputmode="numeric" pattern="[0-9０-９]*" maxlength="3" autocomplete="off" autocorrect="off" enterkeyhint="next" aria-label="答え"> <span id="remWrap">あまり <input id="rem" type="text" inputmode="numeric" pattern="[0-9０-９]*" maxlength="2" autocomplete="off" autocorrect="off" enterkeyhint="done" aria-label="あまり"></span></div>
  <div class="actions"><button id="check" class="primary">こたえあわせ</button><button id="hint" class="yellow">💡 ヒント</button></div>
  <div id="hintbox" class="hintbox"></div><div id="msg" class="msg" aria-live="polite"></div>
  <div style="text-align:center"><button id="quit" class="soft">ステージにもどる</button></div>
 </div>
</section>

<section id="result" class="screen"><div class="card result">
 <h1>🎉 10問チャレンジ終了！</h1><div class="score"><span id="score">0</span>/10</div><div id="resultStars" class="resultstars"></div><h2 id="resultTitle"></h2><p id="newBest"></p>
 <div class="records"><div class="rec">今回<br><b id="rScore"></b></div><div class="rec">ベスト<br><b id="rBest"></b></div><div class="rec">連続正解<br><b id="rStreak"></b></div></div>
 <button id="again" class="primary">🔁 もう1回</button> <button id="nextStage" class="green">➡ 次のステージ</button> <button id="homeBtn" class="soft">🏘️ 町にもどる</button>
</div></section>

<section id="collection" class="screen"><div class="card"><h1>🏅 コレクション</h1><p class="sub">これまでの挑戦を振り返ろう</p><div id="badges" class="collection"></div><div id="stageRecords"></div><p class="tiny">記録はこのブラウザ内だけに保存されます。名前やIDは保存しません。</p><button id="collectionHome" class="primary">🏘️ もどる</button></div></section>

<div class="footer">登録不要・広告なし・端末内保存　／　わりざんマスター 2.0.2</div>
</main><div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
"use strict";
(()=>{
const $=id=>document.getElementById(id), KEY="warizanMasterGameV2";
const defs=[
 {id:0,name:"九九でわる",ico:"🌱",kind:"basic"},
 {id:1,name:"同じ数ずつ",ico:"👥",kind:"equal"},
 {id:2,name:"いくつ分",ico:"⭕",kind:"group"},
 {id:3,name:"あまり",ico:"🍬",kind:"remain"},
 {id:4,name:"ボス・まぜこぜ",ico:"🏰",kind:"mix"}
];
function fresh(){return{unlocked:1,clears:0,bestStreak:0,stages:defs.map(()=>({best:0,stars:0,plays:0})),badges:{first:false,perfect:false,streak:false,all:false}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(!x||!Array.isArray(x.stages)||x.stages.length!==5)return fresh();return x}catch(_){return fresh()}}
let s=load(),stage=0,idx=0,score=0,streak=0,roundMaxStreak=0,q=null,answered=false,hintUsed=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(_){}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function totalStars(){return s.stages.reduce((a,x)=>a+x.stars,0)}
function home(){
 $("clears").textContent=s.clears;$("bestStreak").textContent=s.bestStreak;$("totalStars").textContent=totalStars();
 const m=$("map");m.replaceChildren();
 defs.forEach((d,i)=>{const b=document.createElement("button");const locked=i>s.unlocked;b.className="stage "+(locked?"lock ":"")+(s.stages[i].stars?"done":"");b.disabled=locked;
 b.innerHTML=`<span class="ico">${locked?"🔒":d.ico}</span>${i+1}. ${d.name}<br><span class="stars">${"★".repeat(s.stages[i].stars)}${"☆".repeat(3-s.stages[i].stars)}</span>`;
 b.onclick=()=>start(i);m.append(b)});
 const icons=["🏠","🌳","🏫","🏪","🌷","🏡","🌲","🏰","🚉","🎡","⛲","🎠","🌈","🏟️","🎆"];
 $("town").textContent=icons.slice(0,Math.max(1,totalStars())).join(" ");
 $("continue").onclick=()=>start(Math.min(s.unlocked,4));show("home");
}
function kindFor(){const k=defs[stage].kind;if(k==="mix")return["equal","group","remain"][rnd(0,2)];return k==="basic"?"group":k}
function make(){
 const kind=kindFor(),max=stage===0?5:stage<3?7:9,d=rnd(2,max),a=rnd(1,max),r=kind==="remain"?rnd(1,d-1):0;
 q={kind,d,a,r,n:d*a+r};answered=false;hintUsed=false;$("ans").value="";$("rem").value="";$("msg").textContent="";$("hintbox").classList.remove("on");
 $("remWrap").style.display=kind==="remain"?"inline":"none";$("stageName").textContent=`${defs[stage].ico} ${defs[stage].name}`;$("qnum").textContent=`${idx+1} / 10`;$("bar").style.width=(idx*10)+"%";
 $("story").textContent=kind==="equal"?`${q.n}こを ${q.d}人に同じ数ずつ分けます。1人分は何こ？`:kind==="group"?`${q.n}こを ${q.d}こずつに分けます。何グループできる？`:kind==="remain"?`${q.n}こを ${q.d}こずつに分けます。何グループできて、いくつあまる？`:"";
 $("problem").textContent=`${q.n} ÷ ${q.d} ＝ ？`;const v=$("visual");v.replaceChildren();for(let i=0;i<q.n;i++){let z=document.createElement("i");z.className="dot";v.append(z)}
 $("check").textContent="こたえあわせ";$("ans").focus({preventScroll:true});
}
function start(i){stage=i;idx=score=streak=roundMaxStreak=0;show("game");make()}
function check(){
 if(answered){next();return}
 const normalizeNumber=v=>String(v??"").normalize("NFKC").replace(/[\s　]/g,"");
 const a=normalizeNumber($("ans").value),r=normalizeNumber($("rem").value);
 const av=Number(a),rv=Number(r);
 if(a===""||!Number.isInteger(av)||av<0||(q.kind==="remain"&&(r===""||!Number.isInteger(rv)||rv<0))){$("msg").textContent="答えの数字をたしかめてね。";return}
 const ok=av===q.a&&(q.kind!=="remain"||rv===q.r);answered=true;
 if(ok){score++;streak++;roundMaxStreak=Math.max(roundMaxStreak,streak);$("msg").textContent="⭕ せいかい！";}else{streak=0;$("msg").textContent=`答えは ${q.a}${q.kind==="remain"?" あまり "+q.r:""}。つぎで取り返そう！`}
 $("check").textContent=idx===9?"けっかを見る":"つぎの問題";$("check").focus({preventScroll:true});
}
function next(){idx++;if(idx>=10){finish();return}make()}
function hint(){if(answered)return;hintUsed=true;$("hintbox").classList.add("on");$("hintbox").textContent=q.kind==="remain"?`${q.d}×□ が ${q.n}をこえない、一番大きい九九を探そう。`:`${q.d}×□＝${q.n} になる九九を探そう。`}
function finish(){
 const rec=s.stages[stage],old=rec.best;rec.plays++;rec.best=Math.max(rec.best,score);const stars=score===10?3:score>=8?2:score>=6?1:0;rec.stars=Math.max(rec.stars,stars);s.clears++;
 s.bestStreak=Math.max(s.bestStreak,roundMaxStreak);if(score>=6&&stage<4)s.unlocked=Math.max(s.unlocked,stage+1);
 s.badges.first=true;if(score===10)s.badges.perfect=true;if(roundMaxStreak>=5)s.badges.streak=true;if(s.stages.every(x=>x.stars>0))s.badges.all=true;save();
 $("score").textContent=score;$("rScore").textContent=score+"問";$("rBest").textContent=rec.best+"問";$("rStreak").textContent=roundMaxStreak+"問";
 $("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("resultTitle").textContent=stars===3?"パーフェクト！":stars===2?"すごい！":stars===1?"ステージクリア！":"もう一度チャレンジ！";
 $("newBest").textContent=score>old?"🎊 自己ベスト更新！":"ベスト "+rec.best+"/10。次は記録更新をねらおう！";
 $("nextStage").hidden=!(score>=6&&stage<4);show("result");if(score>=8)confetti();
}
function confetti(){const c=$("confetti");c.replaceChildren();for(let i=0;i<34;i++){const x=document.createElement("i");x.textContent=["⭐","●","◆","▲"][i%4];x.style.left=rnd(0,98)+"%";x.style.animationDelay=(Math.random()*.5)+"s";c.append(x)}setTimeout(()=>c.replaceChildren(),2200)}
function collection(){
 const data=[["first","🎫","はじめての挑戦"],["perfect","👑","10問パーフェクト"],["streak","🔥","5問連続正解"],["all","🏆","全ステージクリア"]];
 const b=$("badges");b.replaceChildren();data.forEach(([k,ico,t])=>{const d=document.createElement("div");d.className="badge "+(s.badges[k]?"":"lock");d.innerHTML=`<div class="ico">${ico}</div>${t}`;b.append(d)});
 $("stageRecords").innerHTML="<h2>📊 ステージ記録</h2>"+defs.map((d,i)=>`<p><b>${d.ico} ${d.name}</b>　ベスト ${s.stages[i].best}/10　${"★".repeat(s.stages[i].stars)}${"☆".repeat(3-s.stages[i].stars)}　挑戦 ${s.stages[i].plays}回</p>`).join("");
 show("collection");
}
$("check").onclick=check;$("hint").onclick=hint;$("quit").onclick=home;$("again").onclick=()=>start(stage);$("nextStage").onclick=()=>start(Math.min(stage+1,4));$("homeBtn").onclick=home;$("collectionBtn").onclick=collection;$("collectionHome").onclick=home;
$("ans").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();q.kind==="remain"&&!answered?$("rem").focus():check()}};$("rem").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();check()}};
home();
})();
</script></body></html>
