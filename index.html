</style></head><body><main><section class="card"><h1>➗ わりざんマスター</h1><p class="sub">見て・動かして・九九につなげよう</p>
<div class="row"><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">📝 今日 <b id="today">0</b>問</span></div>

</section><footer>個人情報は集めません。学習記録はこの端末内だけに保存します。</footer></main>
<script>"use strict";(()=>{const $=x=>document.getElementById(x),K="warizanMasterV5",day=()=>new Date().toLocaleDateString("sv-SE");
let supportWrongCount=0;
let s={stars:0,streak:0,tries:0,correct:0,miss:{equal:0,group:0,remain:0,story:0},weak:[],day:day(),dayDone:0,level:1},mode="equal",q,h=0,done=false,serial=0,labCounts=[],placed=0,turn=0,dragMode=false,lockY=0;
try{Object.assign(s,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}if(s.day!==day()){s.day=day();s.dayDone=0}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,save=()=>{try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}};
function stats(){s.level=Math.min(3,1+Math.floor(s.correct/12));$("stars").textContent=s.stars;$("streak").textContent=s.streak;$("today").textContent=s.dayDone;$("bar").style.width=Math.min(100,s.dayDone*10)+"%";$("challengeText").textContent=(s.dayDone>=10?"🎉 今日の10問クリア！":"今日の10問 "+s.dayDone+"/10")+"　Lv."+s.level;
let w=Object.entries(s.miss).sort((a,b)=>b[1]-a[1])[0],nm={equal:"同じ数ずつ",group:"いくつ分",remain:"あまり",story:"文章題"},rate=s.tries?Math.round(s.correct/s.tries*100):0;$("record").textContent="正解率 "+rate+"％。現在Lv."+s.level+"。"+(w[1]?"「"+nm[w[0]]+"」で迷うことが多めです。":"目立ったつまずきはまだありません。");
let ic=["🏠","🌳","🏫","🏪","🌷","🏡","🌲","🏰","🚉","🎡"],n=Math.min(10,Math.floor(s.correct/3)+1);$("town").textContent=ic.slice(0,n).join(" ");let b=[];if(s.correct>=5)b.push("🥉");if(s.correct>=15)b.push("🥈");if(s.correct>=30)b.push("🥇");if(s.dayDone>=10)b.push("🏅");if(s.streak>=5)b.push("🔥");$("badges").textContent=b.length?"バッジ "+b.join(" "):"バッジはこれから！";save()}
function box(n,left=false){let b=document.createElement("span");b.className="group"+(left?" left":"");for(let i=0;i<n;i++){let d=document.createElement("i");d.className="dot";b.appendChild(d)}return b}
function draw(g,e,l=0){$("visual").innerHTML="";if(g*e+l>50)return;for(let i=0;i<g;i++)$("visual").appendChild(box(e));if(l)$("visual").appendChild(box(l,true))}
function base(easy=false,m=mode){let max=easy?5:(s.level===1?5:s.level===2?7:9),d=rnd(2,max),a=rnd(1,max),r=m==="remain"?rnd(1,d-1):0;return{d,a,r,n:d*a+r,m}}
function render(){h=0;done=false;$("ans").value="";$("rem").value="";$("msg").textContent="";$("lab").classList.toggle("show",mode==="lab");$("answerArea").style.display=mode==="lab"?"none":"block";$("rw").style.display=q.m==="remain"?"inline":"none";
if(mode==="story"){let eq=q.m==="equal";$("story").textContent=eq?`クッキーが ${q.n}こ。${q.d}人で同じ数ずつ分けます。1人分は？`:`色紙が ${q.n}まい。${q.d}まいずつ配ります。何人に配れる？`;draw(eq?q.d:q.a,eq?q.a:q.d)}
else if(mode==="lab"){setupLab();return}
else if(q.m==="equal"){$("story").textContent=`${q.n}こを ${q.d}人に同じ数ずつ分けます。1人分はいくつ？`;draw(q.d,q.a)}
else if(q.m==="group"){$("story").textContent=`${q.n}こを ${q.d}こずつに分けます。何グループできる？`;draw(q.a,q.d)}
else{$("story").textContent=`${q.n}こを ${q.d}こずつに分けます。何グループできて、いくつあまる？`;draw(q.a,q.d,q.r)}
$("problem").textContent=`${q.n} ÷ ${q.d} ＝ ？`;active()}
function active(){["equal","group","remain","storyMode","labMode"].forEach(x=>$(x).classList.remove("on"));$(mode==="story"?"storyMode":mode==="lab"?"labMode":mode).classList.add("on")}
function make(easy=false){serial++;let m=mode==="story"?(Math.random()<.5?"equal":"group"):mode==="lab"?"equal":mode;if(s.weak.length&&serial%4===0&&!easy&&mode!=="lab"){q=s.weak.shift();mode=q.m}else q=base(easy,m);render()}
function setupLab(){if(dragMode)setDragMode(false);done=false;q=base(s.level===1,"equal");$("story").textContent=`${q.n}この●を ${q.d}人に、同じ数ずつ分けてみよう。`;$("problem").textContent=`${q.n} ÷ ${q.d}`;$("visual").innerHTML="";labCounts=Array(q.d).fill(0);placed=0;turn=0;$("labTitle").textContent="ドラッグするときは、下の「ドラッグモード ON」を押そう";renderLab();active()}
function renderLab(){
$("tray").innerHTML="";
for(let i=0;i<q.n-placed;i++){
 let p=document.createElement("button");p.className="piece";p.type="button";p.setAttribute("aria-label","青い丸を配る");
 p.onpointerdown=e=>{if(e.pointerType!=="touch")dragStart(e,p)};
 p.ontouchstart=e=>touchDragStart(e,p);
 $("tray").appendChild(p)
}
$("buckets").innerHTML="";
labCounts.forEach((c,i)=>{
 let b=document.createElement("div");b.className="bucket";b.dataset.i=i;
 let dots="";for(let k=0;k<c;k++)dots+="<i class='inpiece'></i>";
 b.innerHTML=(i+1)+"人目<div class='count'>"+c+"こ</div><div class='bucketDots'>"+dots+"</div>";
 $("buckets").appendChild(b)
});
$("labHelp").textContent=placed<q.n?`あと ${q.n-placed}こ。どの人に入れるか自分で決めよう。`:
(equalLab()?`できた！ 全員 ${labCounts[0]}こずつ。 ${q.n} ÷ ${q.d} ＝ ${labCounts[0]}`:"まだ同じ数ずつではないよ。箱の数を見比べよう。");
}
function equalLab(){return placed===q.n&&labCounts.every(x=>x===labCounts[0])}
function creditLab(){if(done||!equalLab())return;done=true;s.correct++;s.stars++;s.dayDone++;s.streak++;$("msg").textContent="⭕ 同じ数ずつ分けられた！";stats()}
function putIn(i){if(done||placed>=q.n)return;labCounts[i]++;placed++;renderLab();if(placed===q.n)creditLab()}
function blockPageMove(e){if(dragMode)e.preventDefault()}
function setDragMode(on){
 dragMode=on;$("lab").classList.toggle("dragmode",on);
 $("dragToggle").textContent=on?"🔓 タップ移動モード":"✋ ドラッグモード ON";
 $("dragToggle").className=on?"green":"orange";
 $("modeNotice").textContent=on?"ドラッグモード：画面を固定中。●を箱まで運べます":"通常モード：画面をスクロールできます";
 if(on){lockY=window.scrollY;document.body.style.top="-"+lockY+"px";document.body.classList.add("dragLock");document.addEventListener("touchmove",blockPageMove,{passive:false})}
 else{document.removeEventListener("touchmove",blockPageMove);document.body.classList.remove("dragLock");document.body.style.top="";window.scrollTo(0,lockY)}
}
function selectPiece(p){
 if(dragMode||done||placed>=q.n)return;
 document.querySelectorAll(".piece").forEach(x=>x.classList.remove("selected"));
 document.querySelectorAll(".bucket").forEach(x=>x.classList.remove("selectTarget"));
 selectedPiece=p;p.classList.add("selected");
 document.querySelectorAll(".bucket").forEach(b=>b.classList.add("selectTarget"));
 const msg=document.querySelector(".modeNotice");
 if(msg)msg.textContent="青い●を選びました。入れたい箱をタップしてください。";
}
function tapBucket(i){
 if(dragMode||!selectedPiece)return;
 selectedPiece=null;
 document.querySelectorAll(".piece").forEach(x=>x.classList.remove("selected"));
 document.querySelectorAll(".bucket").forEach(x=>x.classList.remove("selectTarget"));
 putIn(i);
}
function touchDragStart(e,p){
 if(done||placed>=q.n)return;
 if(!dragMode){e.preventDefault();selectPiece(p);return}
 if(!e.touches||!e.touches[0])return;
 e.preventDefault();e.stopPropagation();
 const t=e.touches[0],r=p.getBoundingClientRect(),ghost=p.cloneNode(true);
 ghost.classList.add("dragging");ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";document.body.appendChild(ghost);
 let x=t.clientX,y=t.clientY,moved=false,sx=x,sy=y;
 const paint=()=>{ghost.style.left=(x-r.width/2)+"px";ghost.style.top=(y-r.height/2)+"px";document.querySelectorAll(".bucket").forEach(b=>b.classList.remove("drop"));let el=document.elementFromPoint(x,y),b=el&&el.closest(".bucket");if(b)b.classList.add("drop")};
 const move=ev=>{if(!ev.touches||!ev.touches[0])return;ev.preventDefault();ev.stopPropagation();x=ev.touches[0].clientX;y=ev.touches[0].clientY;if(Math.hypot(x-sx,y-sy)>5)moved=true;paint()};
 const end=ev=>{ev.preventDefault();ev.stopPropagation();p.removeEventListener("touchmove",move);p.removeEventListener("touchend",end);p.removeEventListener("touchcancel",cancel);let el=document.elementFromPoint(x,y),b=el&&el.closest(".bucket");ghost.remove();document.querySelectorAll(".bucket").forEach(v=>v.classList.remove("drop"));if(moved&&b)putIn(+b.dataset.i)};
 const cancel=()=>{ghost.remove();document.querySelectorAll(".bucket").forEach(v=>v.classList.remove("drop"))};
 paint();p.addEventListener("touchmove",move,{passive:false});p.addEventListener("touchend",end,{passive:false});p.addEventListener("touchcancel",cancel,{passive:false})
}
function dragStart(e,p){
 if(done||placed>=q.n)return;
 if(!dragMode){e.preventDefault();selectPiece(p);return;}
 e.preventDefault();e.stopPropagation();
 $("lab").classList.add("dragmode");
 try{p.setPointerCapture(e.pointerId)}catch(_){}
 const r=p.getBoundingClientRect(),ghost=p.cloneNode(true);
 ghost.classList.add("dragging");ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";document.body.appendChild(ghost);
 let moved=false,sx=e.clientX,sy=e.clientY,lastX=e.clientX,lastY=e.clientY;
 const move=ev=>{
   if(ev.pointerId!==e.pointerId)return;ev.preventDefault();lastX=ev.clientX;lastY=ev.clientY;
   if(Math.hypot(lastX-sx,lastY-sy)>5)moved=true;
   ghost.style.left=(lastX-r.width/2)+"px";ghost.style.top=(lastY-r.height/2)+"px";
   document.querySelectorAll(".bucket").forEach(b=>b.classList.remove("drop"));
   let el=document.elementFromPoint(lastX,lastY),b=el&&el.closest(".bucket");if(b)b.classList.add("drop")
 };
 const finish=ev=>{
   if(ev.pointerId!==e.pointerId)return;ev.preventDefault();
   p.removeEventListener("pointermove",move);p.removeEventListener("pointerup",finish);p.removeEventListener("pointercancel",cancel);
   try{p.releasePointerCapture(e.pointerId)}catch(_){}
   let el=document.elementFromPoint(lastX,lastY),b=el&&el.closest(".bucket");
   ghost.remove();document.querySelectorAll(".bucket").forEach(x=>x.classList.remove("drop"));
   if(moved&&b)putIn(+b.dataset.i)
 };
 const cancel=ev=>{if(ev.pointerId!==e.pointerId)return;ghost.remove();document.querySelectorAll(".bucket").forEach(x=>x.classList.remove("drop"))};
 ghost.style.left=(e.clientX-r.width/2)+"px";ghost.style.top=(e.clientY-r.height/2)+"px";
 p.addEventListener("pointermove",move,{passive:false});p.addEventListener("pointerup",finish,{passive:false});p.addEventListener("pointercancel",cancel,{passive:false})
}
function place(){if(mode!=="lab"||placed>=q.n||done)return;putIn(turn);turn=(turn+1)%q.d}
function hint(){h++;$("msg").textContent=h===1?`${q.d} × □ で ${q.n-q.r} になる九九を探そう。`:h===2?`${q.d} × ${q.a} ＝ ${q.d*q.a}。図も数えてみよう。`:`答えの部分は ${q.a}${q.m==="remain"?"。黄色い●があまり。":"。"}`}
function check(){if(done||mode==="lab")return;let a=$("ans").value.trim(),r=$("rem").value.trim();if(!a){$("msg").textContent="答えを入れてね。";return}if(q.m==="remain"&&!r){$("msg").textContent="あまりも入れてね。";return}s.tries++;let ok=+a===q.a&&(q.m!=="remain"||+r===q.r);if(ok){done=true;s.correct++;s.stars++;s.streak++;s.dayDone++;$("msg").textContent=s.dayDone===10?"🏅 せいかい！ 今日の10問クリア！":"⭕ せいかい！"}else{s.streak=0;s.miss[mode==="story"?"story":q.m]++;if(s.weak.length<8)s.weak.push({...q});$("msg").textContent="△ おしい！ 少し後でもう一度出るよ。"}stats()}
function set(m){mode=m;make()}$("equal").onclick=()=>set("equal");$("group").onclick=()=>set("group");$("remain").onclick=()=>set("remain");$("storyMode").onclick=()=>set("story");$("labMode").onclick=()=>set("lab");$("weak").onclick=()=>{let w=Object.entries(s.miss).filter(x=>x[0]!=="story").sort((a,b)=>b[1]-a[1])[0];set(w&&w[1]?w[0]:"equal")};$("check").onclick=()=>{const was=done;check();if(!done&&!was)showAdaptiveSupport()};$("hint").onclick=hint;$("next").onclick=()=>make();$("easy").onclick=()=>make(true);$("dragToggle").onclick=()=>setDragMode(!dragMode);$("resetLab").onclick=setupLab;$("ans").onkeydown=e=>{if(e.key==="Enter")q.m==="remain"?$("rem").focus():check()};$("rem").onkeydown=e=>{if(e.key==="Enter")check()};stats();make();
let gLab={total:0,size:0,placed:0,selected:null,counts:[]};
function setupGroupLab(){
 const gl=$("groupLab"); if(!gl)return;
 if(dragMode)setDragMode(false);
 $("lab")&&$("lab").classList.remove("show");
 let total=q&&q.n?q.n:12, size=q&&q.d?q.d:3;
 if(size<2||total<size){total=12;size=3}
 // Keep the conceptual model manageable.
 total=Math.min(total,30);
 gLab={total,size,placed:0,selected:null,counts:[]};
 gl.classList.add("show");
 $("groupInstruction").textContent=total+"こを、"+size+"こずつのまとまりにしよう。";
 $("groupDone").textContent="";
 renderGroupLab();
 gl.scrollIntoView({behavior:"smooth",block:"center"});
}
function renderGroupLab(){
 const rem=gLab.total-gLab.placed;
 $("groupPieces").innerHTML="";
 for(let i=0;i<rem;i++){
   const b=document.createElement("button"); b.className="gp"; b.setAttribute("aria-label","青い丸");
   b.onclick=()=>selectGroupPiece(b); $("groupPieces").appendChild(b);
 }
 const need=Math.ceil(gLab.total/gLab.size);
 $("groupSlots").innerHTML="";
 for(let i=0;i<need;i++){
   if(gLab.counts[i]==null)gLab.counts[i]=0;
   const d=document.createElement("button"); d.className="groupSlot"+(gLab.counts[i]>=gLab.size?" full":"");
   d.innerHTML="まとまり "+(i+1)+"<br><span>"+("● ".repeat(gLab.counts[i]))+"</span><br>"+gLab.counts[i]+" / "+gLab.size;
   d.onclick=()=>putGroupPiece(i); $("groupSlots").appendChild(d);
 }
 if(rem===0){
   const full=gLab.counts.filter(x=>x===gLab.size).length, left=gLab.counts.reduce((a,x)=>a+(x<gLab.size?x:0),0);
   $("groupDone").textContent=left?full+"まとまりできて、あまり "+left+"こ！":full+"まとまりできた！";
 }
}
function selectGroupPiece(b){
 document.querySelectorAll(".gp").forEach(x=>x.classList.remove("sel"));
 gLab.selected=b;b.classList.add("sel");
 $("groupDone").textContent="入れたい「まとまり」をタップしよう。";
}
function putGroupPiece(i){
 if(!gLab.selected)return;
 if(gLab.counts[i]>=gLab.size){$("groupDone").textContent="そのまとまりは、もう"+gLab.size+"こです。";return}
 gLab.counts[i]++;gLab.placed++;gLab.selected=null;renderGroupLab();
}
function closeGroupLab(){const gl=$("groupLab");if(gl)gl.classList.remove("show")}

const bridgeProblems=[
 {type:"equal",text:"12このクッキーを、3人に同じ数ずつ分けます。1人分は何こ？",a:12,b:3},
 {type:"group",text:"12このクッキーを、3こずつ袋に入れます。袋はいくつできる？",a:12,b:3},
 {type:"equal",text:"20このおはじきを、5人に同じ数ずつ分けます。1人分は何こ？",a:20,b:5},
 {type:"group",text:"20このおはじきを、5こずつのまとまりにします。まとまりはいくつ？",a:20,b:5}
];
let bridgeNow=null;
function startBridge(){
 if(dragMode)setDragMode(false);
 $("lab")&&$("lab").classList.remove("show");$("groupLab")&&$("groupLab").classList.remove("show");
 bridgeNow=bridgeProblems[Math.floor(Math.random()*bridgeProblems.length)];
 $("bridge").classList.add("show");
 $("bridgeQ").textContent=bridgeNow.text;
 $("bridgeMsg").textContent="まず、どんな分け方か考えよう。";
 $("bridge").scrollIntoView({behavior:"smooth",block:"center"});
}
function setupBridgeEqualLab(){
 if(dragMode)setDragMode(false);
 done=false;
 $("lab").classList.add("show");
 $("groupLab")&&$("groupLab").classList.remove("show");
 $("story").textContent=`${q.n}この●を ${q.d}人に、同じ数ずつ分けてみよう。`;
 $("problem").textContent=`${q.n} ÷ ${q.d}`;
 $("visual").innerHTML="";
 labCounts=Array(q.d).fill(0);placed=0;turn=0;
 $("labTitle").textContent="ドラッグするときは、下の「ドラッグモード ON」を押そう";
 renderLab();
}
function chooseBridge(t){
 if(!bridgeNow)return;
 if(t!==bridgeNow.type){
   $("bridgeMsg").textContent="もう一度、ことばに注目してみよう。「同じ数ずつ」かな？「○こずつ」かな？";
   return;
 }
 $("bridgeMsg").textContent="そう！ "+bridgeNow.a+" ÷ "+bridgeNow.b+" の考え方だね。操作して確かめよう。";
 // Put the bridge numbers into q so the existing manipulatives use the same expression.
 q={d:bridgeNow.b,a:Math.floor(bridgeNow.a/bridgeNow.b),r:bridgeNow.a%bridgeNow.b,n:bridgeNow.a,m:bridgeNow.type};
 setTimeout(()=>{
   $("bridge").classList.remove("show");
   if(t==="equal") setupBridgeEqualLab(); else setupGroupLab();
 },650);
}
function closeBridge(){$("bridge")&&$("bridge").classList.remove("show")}


function showAdaptiveSupport(){
 supportWrongCount++;
 const p=$("supportPanel"); if(!p)return;
 p.classList.add("show");
 let kind=(q&&q.m)||mode;
 let label=kind==="equal"?"「同じ数ずつ分ける」":kind==="group"?"「○こずつまとめる」":kind==="remain"?"「あまりも考える」":"わり算";
 $("supportTag").textContent="この問題は "+label+" の考え方。";
}
function hideAdaptiveSupport(){const p=$("supportPanel");if(p)p.classList.remove("show")}
function supportManipulate(){
 hideAdaptiveSupport();
 let kind=(q&&q.m)||mode;
 if(kind==="group"){setupGroupLab();return}
 // equal/remainder: use the proven v11/v14 equal-sharing manipulative.
 setupBridgeEqualLab();
}
function supportKuku(){
 if(!q)return;
 const d=q.d||1, a=q.a||Math.floor((q.n||0)/d);
 const n=q.n||d*a;
 const base=n-(q.r||0);
 $("supportText").textContent=`九九で「${d} × □ = ${base}」を考えてみよう。`;
 $("supportTag").textContent=(q.r||0)>0?`${base}まで分けると、${q.r}こ残るよ。`:"答えそのものはまだ表示しません。";
 $("supportPanel").classList.add("show");
}
function supportEasy(){
 hideAdaptiveSupport();
 // Preserve current question for later weak review if the app has a weak queue.
 try{
   if(Array.isArray(data?.weak)) data.weak.push({...q});
 }catch(_){}
 const kind=(q&&q.m)||mode;
 if(kind==="group"){
   q={d:2,a:3,r:0,n:6,m:"group"};
   $("story").textContent="6この●を、2こずつのまとまりにしよう。";
   $("problem").textContent="6 ÷ 2";
   setupGroupLab();
 }else{
   q={d:2,a:3,r:0,n:6,m:"equal"};
   $("story").textContent="6この●を、2人に同じ数ずつ分けよう。";
   $("problem").textContent="6 ÷ 2";
   setupBridgeEqualLab();
 }
}

Object.assign(window,{
 setupGroupLab,closeGroupLab,startBridge,chooseBridge,closeBridge,tapBucket,showAdaptiveSupport,hideAdaptiveSupport,supportManipulate,supportKuku,supportEasy
});
})();
