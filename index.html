<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef6ff"><title>わりざんマスター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6ff;color:#20304a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 22px #23375a1f}
h1{text-align:center;margin:3px;font-size:30px}.sub{text-align:center;color:#64748b;margin:3px 0 12px}.tabs,.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:#e8f2ff;border-radius:999px;padding:7px 11px;font-weight:800}.tabs button{min-height:42px;padding:8px 12px}
button{border:0;border-radius:14px;min-height:55px;padding:11px;font-size:17px;font-weight:900;touch-action:manipulation;cursor:pointer}
button.active{outline:4px solid #93c5fd}.blue{background:#2563eb;color:#fff}.yellow{background:#fde68a}.soft{background:#dbeafe}.green{background:#dcfce7}
.story{text-align:center;font-size:19px;min-height:58px;margin:16px 0 2px;line-height:1.5}.problem{text-align:center;font-size:52px;font-weight:900;margin:12px 0}
.visual{display:flex;justify-content:center;align-items:flex-start;gap:8px;flex-wrap:wrap;min-height:58px}.group{border:2px solid #bfdbfe;border-radius:12px;padding:7px;min-width:48px;text-align:center}
.dot{display:inline-block;width:17px;height:17px;border-radius:50%;background:#60a5fa;margin:2px}.answer{text-align:center;margin-top:8px}
input{width:155px;font-size:40px;text-align:center;border:3px solid #94a3b8;border-radius:14px;padding:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.msg{text-align:center;font-size:21px;font-weight:900;min-height:68px;padding:12px 2px}.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#60a5fa;width:0}
.panel{margin-top:13px;background:#f8fafc;border-radius:15px;padding:12px}.small{font-size:14px;color:#64748b}footer{text-align:center;color:#64748b;font-size:12px;margin:12px}
@media(max-width:480px){.problem{font-size:45px}.story{font-size:17px}h1{font-size:27px}.card{padding:13px}}
</style></head><body><main><section class="card">
<h1>➗ わりざんマスター</h1><p class="sub">「分ける」と「いくつ分」を見てわかろう</p>
<div class="stats"><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🔥 <b id="streak">0</b>連続</span><span class="pill">📝 今日 <b id="today">0</b>問</span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="tabs">
<button id="equalTab" class="soft">同じ数ずつ</button><button id="groupTab" class="soft">いくつ分</button><button id="remainTab" class="soft">あまり</button><button id="weakTab" class="green">にがて復習</button>
</div>
<div id="story" class="story"></div><div id="problem" class="problem"></div><div id="visual" class="visual"></div>
<div class="answer"><input id="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="答え"></div>
<div class="buttons"><button id="check" class="blue">こたえあわせ</button><button id="hint" class="yellow">ヒント</button><button id="next" class="soft">つぎの問題</button><button id="easy" class="green">やさしくする</button></div>
<div id="msg" class="msg" aria-live="polite"></div>
<div class="panel"><b>🌱 学びの記録</b><div id="record" class="small"></div></div>
</section><footer>名前などの個人情報は集めません。学習記録はこの端末内だけに保存します。</footer></main>
<script>
"use strict";
(function(){
const $=id=>document.getElementById(id), KEY="warizanMasterV2";
let state={stars:0,streak:0,today:0,attempts:0,correct:0,misses:{equal:0,group:0,remain:0}},mode="equal",q=null;
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)state=Object.assign(state,x)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function stat(){ $("stars").textContent=state.stars;$("streak").textContent=state.streak;$("today").textContent=state.today;$("bar").style.width=Math.min(100,(state.correct%10)*10)+"%";
const rate=state.attempts?Math.round(state.correct/state.attempts*100):0;$("record").textContent="正解率 "+rate+"％ ／ 同じ数ずつ "+state.misses.equal+"回・いくつ分 "+state.misses.group+"回・あまり "+state.misses.remain+"回 まちがえました。";}
function active(){["equal","group","remain"].forEach(m=>$(m+"Tab").classList.toggle("active",mode===m))}
function clearVisual(){$("visual").innerHTML=""}
function groupBox(n){const b=document.createElement("span");b.className="group";for(let i=0;i<n;i++){const d=document.createElement("i");d.className="dot";b.appendChild(d)}return b}
function draw(groups,each,left){clearVisual();if(groups*each>40)return;for(let i=0;i<groups;i++)$("visual").appendChild(groupBox(each));if(left){const b=groupBox(left);b.title="あまり";b.style.borderStyle="dashed";$("visual").appendChild(b)}}
function make(easy=false){
 let d=easy?rand(2,5):rand(2,9),a=easy?rand(1,5):rand(1,9),n=d*a,r=0;
 if(mode==="remain"){r=rand(1,d-1);n=d*a+r}
 q={n,d,a,r,mode};$("answer").value="";$("msg").textContent="";
 if(mode==="equal"){$("story").textContent=n+"こを "+d+"人に、同じ数ずつ分けます。1人分はいくつ？";$("problem").textContent=n+" ÷ "+d+" ＝ ？";draw(d,a,0)}
 if(mode==="group"){$("story").textContent=n+"こを "+d+"こずつに分けます。何グループできる？";$("problem").textContent=n+" ÷ "+d+" ＝ ？";draw(a,d,0)}
 if(mode==="remain"){$("story").textContent=n+"こを "+d+"こずつに分けます。何グループできる？（あまりは次に考えます）";$("problem").textContent=n+" ÷ "+d+" ＝ ？ あまり "+r;draw(a,d,r)}
 active();$("answer").focus()
}
function hint(){if(mode==="equal")$("msg").textContent=dummy(q.d)+" × □ ＝ "+q.n+" に近い九九を探そう。";else $("msg").textContent=q.d+"こずつ丸で囲むイメージ。"+q.d+" × □ ＝ "+(q.n-q.r)+"。"}
function dummy(x){return String(x)}
function check(){
 const raw=$("answer").value.trim();if(raw===""){$("msg").textContent="答えを入れてね。";return}
 state.attempts++;state.today++;
 if(Number(raw)===q.a){state.correct++;state.stars++;state.streak++;$("msg").textContent="⭕ せいかい！ "+q.d+" × "+q.a+" ＝ "+(q.d*q.a)+(q.r?"、あまり "+q.r:"")}
 else{state.streak=0;state.misses[q.mode]++;$("msg").textContent="△ おしい！ 図とヒントを見て、もう一度考えよう。"}
 save();stat()
}
function setMode(m){mode=m;make(false)}
$("equalTab").onclick=()=>setMode("equal");$("groupTab").onclick=()=>setMode("group");$("remainTab").onclick=()=>setMode("remain");
$("weakTab").onclick=()=>{const es=Object.entries(state.misses).sort((a,b)=>b[1]-a[1]);setMode(es[0][1]===0?"equal":es[0][0])};
$("check").onclick=check;$("hint").onclick=hint;$("next").onclick=()=>make(false);$("easy").onclick=()=>make(true);
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
window.addEventListener("error",e=>{$("msg").textContent="読み込みエラーが起きました。再読み込みしてください。"});
stat();make();
})();</script></body></html>
