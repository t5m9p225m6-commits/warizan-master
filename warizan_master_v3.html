<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>わりざんマスター</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#20304a}main{max-width:760px;margin:auto;padding:12px}.card{background:white;border-radius:22px;padding:16px}h1{text-align:center}.stats,.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{background:#e8f2ff;padding:7px 11px;border-radius:99px;font-weight:bold}button{border:0;border-radius:14px;padding:11px;min-height:52px;font-size:17px;font-weight:bold}.tabs button{background:#dbeafe}.tabs .on{outline:4px solid #93c5fd}.story{text-align:center;font-size:19px;min-height:55px;margin-top:15px}.problem{text-align:center;font-size:50px;font-weight:900;margin:8px}.visual{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:65px}.group{border:2px solid #93c5fd;border-radius:12px;padding:6px}.left{border-style:dashed;border-color:#f59e0b}.dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:#60a5fa;margin:2px}.left .dot{background:#fbbf24}.step{text-align:center;background:#fff7ed;padding:8px;border-radius:12px;font-weight:bold}.answer{text-align:center;margin:10px}.answer input{width:100px;font-size:34px;text-align:center;border:3px solid #94a3b8;border-radius:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.blue{background:#2563eb;color:white}.yellow{background:#fde68a}.green{background:#dcfce7}.soft{background:#dbeafe}.msg{text-align:center;font-size:20px;font-weight:bold;min-height:60px;padding:10px}.panel{background:#f8fafc;border-radius:14px;padding:10px;margin-top:10px}.town{text-align:center;font-size:28px;min-height:40px}.small{font-size:14px;color:#64748b}footer{text-align:center;font-size:12px;color:#64748b;margin:10px}</style></head>
<body><main><div class="card"><h1>➗ わりざんマスター</h1><div class="stats"><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">📝 <b id="today">0</b>問</span></div>
<div class="tabs"><button id="equal">同じ数ずつ</button><button id="group">いくつ分</button><button id="remain">あまり</button><button id="weak" class="green">にがて復習</button></div>
<div id="story" class="story"></div><div id="problem" class="problem"></div><div id="visual" class="visual"></div><div id="step" class="step"></div>
<div class="answer">答え <input id="ans" type="number" inputmode="numeric"> <span id="rw">あまり <input id="rem" type="number" inputmode="numeric"></span></div>
<div class="buttons"><button id="check" class="blue">こたえあわせ</button><button id="hint" class="yellow">ヒント</button><button id="next" class="soft">つぎの問題</button><button id="easy" class="green">やさしくする</button></div><div id="msg" class="msg"></div>
<div class="panel"><b>🏘️ わりざんタウン</b><div id="town" class="town"></div><div class="small">正解が増えると町が育ちます。</div></div><div class="panel"><b>🌱 次の支援の手がかり</b><div id="record" class="small"></div></div></div>
<footer>個人情報は集めません。記録はこの端末内だけに保存します。</footer></main>
<script>"use strict";(()=>{const $=x=>document.getElementById(x),K="warizanV3";let s={stars:0,streak:0,today:0,tries:0,correct:0,miss:{equal:0,group:0,remain:0}},mode="equal",q,h=0,done=false;try{Object.assign(s,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,save=()=>{try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}};
function stats(){$("stars").textContent=s.stars;$("streak").textContent=s.streak;$("today").textContent=s.today;let w=Object.entries(s.miss).sort((a,b)=>b[1]-a[1])[0],names={equal:"同じ数ずつ",group:"いくつ分",remain:"あまり"};$("record").textContent=s.tries?("正解率 "+Math.round(s.correct/s.tries*100)+"％。"+(w[1]?"「"+names[w[0]]+"」を少し多めに練習。":"順調です。")):"まずは問題に取り組もう。";let icons=["🏠","🌳","🏫","🏪","🌷","🏡","🌲","🏰"],n=Math.min(8,Math.floor(s.correct/3)+1);$("town").textContent=icons.slice(0,n).join(" ")}
function box(n,left){let b=document.createElement("span");b.className="group"+(left?" left":"");for(let i=0;i<n;i++){let d=document.createElement("i");d.className="dot";b.appendChild(d)}return b}
function draw(g,e,l=0){$("visual").innerHTML="";if(g*e+l>45)return;for(let i=0;i<g;i++)$("visual").appendChild(box(e));if(l)$("visual").appendChild(box(l,true))}
function make(easy=false){let d=easy?rnd(2,5):rnd(2,9),a=easy?rnd(1,5):rnd(1,9),r=mode==="remain"?rnd(1,d-1):0,n=d*a+r;q={d,a,r,n};h=0;done=false;$("ans").value="";$("rem").value="";$("msg").textContent="";$("rw").style.display=mode==="remain"?"inline":"none";
if(mode==="equal"){$("story").textContent=n+"こを "+d+"人に同じ数ずつ分けます。1人分はいくつ？";$("step").textContent="青い箱1つが1人分です。";draw(d,a)}
if(mode==="group"){$("story").textContent=n+"こを "+d+"こずつに分けます。何グループできる？";$("step").textContent=d+"こずつ、まとまりを数えよう。";draw(a,d)}
if(mode==="remain"){$("story").textContent=n+"こを "+d+"こずつに分けます。何グループできて、いくつあまる？";$("step").textContent="黄色い●が、まとまりに入らず残った「あまり」です。";draw(a,d,r)}
$("problem").textContent=n+" ÷ "+d+" ＝ ？";["equal","group","remain"].forEach(x=>$(x).classList.toggle("on",x===mode));$("ans").focus()}
function hint(){h++;$("msg").textContent=h===1?q.d+" × □ で "+(q.n-q.r)+" になる九九を探そう。":h===2?q.d+" × "+q.a+" ＝ "+(q.d*q.a)+"。図のまとまりも数えよう。":"答えは "+q.a+(mode==="remain"?"。黄色い●も数えてね。":"。")}
function check(){if(done)return;let a=$("ans").value,r=$("rem").value;if(a===""){ $("msg").textContent="答えを入れてね。";return}if(mode==="remain"&&r===""){ $("msg").textContent="あまりも入れてね。";return}s.tries++;s.today++;let ok=+a===q.a&&(mode!=="remain"||+r===q.r);if(ok){done=true;s.correct++;s.stars++;s.streak++;$("msg").textContent="⭕ せいかい！ よく分けられたね。"}else{s.streak=0;s.miss[mode]++;$("msg").textContent="△ おしい！ 図を見てもう一度。"}save();stats()}
function set(m){mode=m;make()}$("equal").onclick=()=>set("equal");$("group").onclick=()=>set("group");$("remain").onclick=()=>set("remain");$("weak").onclick=()=>{let w=Object.entries(s.miss).sort((a,b)=>b[1]-a[1])[0];set(w[1]?w[0]:"equal")};$("check").onclick=check;$("hint").onclick=hint;$("next").onclick=()=>make();$("easy").onclick=()=>make(true);$("ans").onkeydown=e=>{if(e.key==="Enter")mode==="remain"?$("rem").focus():check()};$("rem").onkeydown=e=>{if(e.key==="Enter")check()};stats();make()})();</script></body></html>
